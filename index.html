<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
</head>
<body>
	<div id="tracks"></div>
	<div id="player"></div>
	<script type="module">
		import { Library, TracksView, Player } from '/music.js';
		async function init() {
			const library = new Library();
			await library.load();
			const player = new Player(document.getElementById('player'), library);
			const tracksView = new TracksView(document.getElementById('tracks'), library, player);
			tracksView.update();
		}
		document.addEventListener('DOMContentLoaded', init);
	</script>
</body>
</html>
